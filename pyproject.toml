[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coopgt"
description = "A library for the study of cooperative game theory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Knight", email = "knightva@cardiff.ac.uk" }]
keywords = ["game-theory", "cooperative-games", "shapley-value", "core"]
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
dependencies = [
    "more-itertools>=10.2.0",
    "numpy>=1.26.1",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/drvinceknight/coopgt"
Documentation = "https://drvinceknight.github.io/coopgt/"

[tool.hatch.version]
path = "src/coopgt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coopgt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "zensical>=0.0.11",
    "mkdocstrings-python>=1.0",
    "packaging>=23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = "--doctest-glob='*.md' --cov=coopgt --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
